name: CI

on:
  push:
    branches: [ main ]
  # スタックPR（baseがmain以外）でもフルCIを走らせる
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Type check shared core package
        run: npm run typecheck:core

      - name: Type check mobile app
        run: npm run mobile:typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Test shared core package
        run: npm run test:core

      - name: Build
        run: npm run build

      - name: Export Android mobile bundle
        run: npm run mobile:export

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # 統合テストのRealtime購読にネイティブWebSocket（Node 21+）が必要
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check no service_role in client code
        run: npm run check:secrets

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Run database smoke tests (pgTAP)
        run: npm run db:test

      - name: Serve Edge Functions in background
        run: |
          nohup npx supabase functions serve > functions-serve.log 2>&1 &
          # edge runtimeイメージのpull完了までポーリング（503/接続不可の間は待つ）
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:55321/functions/v1/complete_task || true)
            if [ "$code" != "503" ] && [ "$code" != "000" ]; then
              echo "edge runtime ready (status $code)"; exit 0
            fi
            sleep 2
          done
          echo "edge runtime did not become ready"; cat functions-serve.log; exit 1

      - name: Run sync integration tests
        run: |
          eval "$(npx supabase status -o env)"
          export SUPABASE_DB_URL="$DB_URL"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_FUNCTIONS_URL="$API_URL/functions/v1"
          npm run test:integration

      - name: Generate database types
        run: npm run db:types

      - name: Type check with generated types
        run: npm run typecheck:core
