name: CI

on:
  push:
    branches: [ main ]
  # スタックPR（baseがmain以外）でもフルCIを走らせる
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Type check shared core package
        run: npm run typecheck:core

      - name: Type check mobile app
        run: npm run mobile:typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Test shared core package
        run: npm run test:core

      - name: Build
        run: npm run build

      - name: Export Android mobile bundle
        run: npm run mobile:export

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 統合テストのRealtime購読とjsdom 30の要件に合わせる
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check no service_role in client code
        run: npm run check:secrets

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Run database smoke tests (pgTAP)
        run: npm run db:test

      - name: Serve Edge Functions in background
        run: |
          # KongはJWT検証をedge-runtime本体を待たずに行うため、認証系ステータスコードは
          # readinessの合図にならない（実際にedge-runtimeが起動する前から401が返る）。
          # edge-runtimeプロセス自身が出す "Serving functions on" ログ行を待つ。
          # ECRのイメージpullがrate limit（toomanyrequests）で落ちることがあるため、
          # その場合はバックオフして再試行する。
          for attempt in 1 2 3 4 5; do
            nohup npx supabase functions serve > functions-serve.log 2>&1 &
            serve_pid=$!
            for i in $(seq 1 60); do
              if grep -q "Serving functions on" functions-serve.log 2>/dev/null; then
                echo "edge runtime ready (attempt $attempt)"; cat functions-serve.log; exit 0
              fi
              if ! kill -0 $serve_pid 2>/dev/null && grep -q "toomanyrequests" functions-serve.log 2>/dev/null; then
                break
              fi
              sleep 2
            done
            if grep -q "toomanyrequests" functions-serve.log 2>/dev/null; then
              echo "image pull rate limited (attempt $attempt), retrying..."
              kill $serve_pid 2>/dev/null || true
              sleep $((attempt * 30))
              continue
            fi
            echo "edge runtime did not become ready"
            cat functions-serve.log
            exit 1
          done
          echo "edge runtime failed after retries"
          cat functions-serve.log
          exit 1

      - name: Warm up complete_task function
        run: |
          # 初回呼び出しはworkerのisolate起動を伴うため502になりうる。
          # 502が消えるまでウォームアップ呼び出しを繰り返す（本テストの前に完了させる）。
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:55321/functions/v1/complete_task || true)
            if [ "$code" != "502" ] && [ "$code" != "000" ]; then
              echo "function warm (status $code)"; exit 0
            fi
            echo "warming up... (status $code)"
            sleep 1
          done
          echo "function did not warm up"
          cat functions-serve.log
          exit 1

      - name: Run sync integration tests
        run: |
          eval "$(npx supabase status -o env)"
          export SUPABASE_DB_URL="$DB_URL"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_FUNCTIONS_URL="$API_URL/functions/v1"
          npm run test:integration

      - name: Show Edge Functions log on failure
        if: failure()
        run: cat functions-serve.log

      - name: Generate database types
        run: |
          # postgres-metaイメージのpullがECRのrate limitで落ちることがあるためリトライする
          for attempt in 1 2 3 4 5; do
            if npm run db:types; then exit 0; fi
            echo "db:types failed (attempt $attempt), retrying..."
            sleep $((attempt * 30))
          done
          exit 1

      - name: Type check with generated types
        run: npm run typecheck:core
