version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 6
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Expo SDK upgrades coordinate these native packages. Keep receiving patch
      # fixes, but do not let the generic production group cross SDK boundaries.
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native-safe-area-context
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native-screens
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # typescript-eslintがpeer dependencyでtypescript <6.1.0を要求しており、
      # TypeScript 7系（ネイティブGoコンパイラへの移行を伴うメジャーリリース）への
      # 単独更新はnpm ci自体が失敗する（#553）。typescript-eslint側がTS7へ
      # 対応してから、両方を同時に更新する。
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
