appId: com.yutakane.lifequest.parity
name: Automatic battle portraits HP victory and defeat (memory only)
---
# The runner requires the guarded battle profile, never clears persistent data.
- launchApp:
    clearState: false
- openLink: "lifequest-parity://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081&disableOnboarding=1&disableAutoLaunch=1&disableFab=1"
- tapOn:
    text: "開く|Open"
    optional: true
- tapOn:
    text: "開く|Open"
    optional: true
- extendedWaitUntil:
    visible: "新しいタスクを追加"
    timeout: 60000
- tapOn: "マップ(, tab,.*)?"
- assertVisible: "最高到達: ステージ 9"
- tapOn:
    text: "ステージ 3 再挑戦"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "強撃.*|勝利！"
    timeout: 10000
- takeScreenshot: "reference-${REFERENCE_THEME}-battle"
- extendedWaitUntil:
    visible: "勝利！"
    timeout: 10000
- assertVisible: "15 XP を獲得！"
- assertNotVisible: "通常攻撃"
- assertVisible: "次へ"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "reference-${REFERENCE_THEME}-victory"
- tapOn: "マップへ"
- scrollUntilVisible:
    element: "ステージ 10 スタート"
    direction: DOWN
- tapOn: "ステージ 10 スタート"
- extendedWaitUntil:
    visible: "敗北..."
    timeout: 10000
- assertVisible: "レベルを上げて再挑戦しましょう！"
- assertNotVisible: "通常攻撃"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "reference-${REFERENCE_THEME}-defeat"
- tapOn: "リトライ"
- assertNotVisible: "通常攻撃"
- assertNotVisible: "戦闘を閉じる"
# Skills remain manual while normal attacks/cooldowns continue automatically.
# Exact cooldown boundaries are covered by fake-clock hook/store parity tests.
- tapOn: "防御態勢"
- tapOn: "強撃"
- extendedWaitUntil:
    visible: "敗北..."
    timeout: 15000
- tapOn: "マップへ"
- assertVisible: "最高到達: ステージ 9"
