appId: com.yutakane.lifequest.parity
name: Inventory selection and filter recovery (daily memory only)
---
- stopApp
- openLink: "lifequest-parity://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8082&disableOnboarding=1&disableAutoLaunch=1&disableFab=1"
- tapOn:
    text: "開く|Open"
    optional: true
- extendedWaitUntil:
    visible: "新しいタスクを追加"
    timeout: 60000
- openLink: "lifequest-parity://inventory"
- assertVisible: "キャラクター画面に戻る"
- tapOn: "キャラクター画面に戻る"
- assertVisible: "プロフィールを編集"
- scrollUntilVisible:
    element: "インベントリを開く"
    direction: DOWN
    centerElement: true
- takeScreenshot: "inventory-entry-${REFERENCE_THEME}"
- tapOn: "インベントリを開く"
- assertVisible: "インベントリ"
- takeScreenshot: "inventory-route-${REFERENCE_THEME}-overview"
- tapOn: "レア：すべて"
- scrollUntilVisible:
    element: "レアをレジェンダリーにする"
    direction: DOWN
    centerElement: true
- takeScreenshot: "inventory-picker-${REFERENCE_THEME}"
- tapOn: "レアをレジェンダリーにする"
- assertVisible: "レア：レジェンダリー"
- scrollUntilVisible:
    element: "表示条件をリセット"
    direction: UP
    centerElement: true
- tapOn: "表示条件をリセット"
- scrollUntilVisible:
    element: "種類：すべて"
    direction: DOWN
    centerElement: true
- tapOn: "種類：すべて"
- tapOn: "種類を防具にする"
- scrollUntilVisible:
    element: "レア：すべて"
    direction: DOWN
    centerElement: true
- tapOn: "レア：すべて"
- tapOn: "レアをコモンにする"
- scrollUntilVisible:
    element: "条件に合う装備がありません。表示条件をリセットしてください。"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element: "インベントリ（0/4）"
    direction: UP
    centerElement: true
- assertVisible: "インベントリ（0/4）"
- scrollUntilVisible:
    element: "表示条件をリセット"
    direction: UP
    centerElement: true
- tapOn: "表示条件をリセット"
- scrollUntilVisible:
    element: "合成"
    direction: UP
    centerElement: true
- tapOn: "合成"
- scrollUntilVisible:
    element: "チェインメイルを合成素材に選択する"
    direction: DOWN
    centerElement: true
- tapOn: "チェインメイルを合成素材に選択する"
- assertVisible: "チェインメイルを合成素材に選択解除する"
- takeScreenshot: "inventory-${REFERENCE_THEME}"
- scrollUntilVisible:
    element: "種類：すべて"
    direction: UP
    centerElement: true
- tapOn: "種類：すべて"
- tapOn: "種類の選択を閉じる"
- scrollUntilVisible:
    element: "チェインメイルを合成素材に選択解除する"
    direction: DOWN
    centerElement: true
- assertVisible: "チェインメイルを合成素材に選択解除する"
- scrollUntilVisible:
    element: "種類：すべて"
    direction: UP
    centerElement: true
- tapOn: "種類：すべて"
- tapOn: "種類をすべてにする"
- scrollUntilVisible:
    element: "チェインメイルを合成素材に選択解除する"
    direction: DOWN
    centerElement: true
- assertVisible: "チェインメイルを合成素材に選択解除する"
- scrollUntilVisible:
    element: "素材の選択を解除"
    direction: UP
    # Accessibility bounds may remain behind the status bar at large text sizes.
    centerElement: true
- tapOn: "素材の選択を解除"
- assertNotVisible: "素材の選択を解除"
- scrollUntilVisible:
    element: "チェインメイルを合成素材に選択する"
    direction: DOWN
    centerElement: true
- tapOn: "チェインメイルを合成素材に選択する"
- scrollUntilVisible:
    element: "種類：すべて"
    direction: UP
    centerElement: true
- tapOn: "種類：すべて"
- tapOn: "種類を武器にする"
- assertVisible: "種類：武器"
- assertNotVisible: "素材の選択を解除"
- scrollUntilVisible:
    element: "表示条件をリセット"
    direction: DOWN
    centerElement: true
- tapOn: "表示条件をリセット"
- scrollUntilVisible:
    element: "売却"
    direction: UP
    centerElement: true
- tapOn: "売却"
- takeScreenshot: "inventory-sale-${REFERENCE_THEME}"
- scrollUntilVisible:
    element: "チェインメイルを売却する"
    direction: DOWN
    centerElement: true
- tapOn: "チェインメイルを売却する"
- tapOn: "キャンセル"
- scrollUntilVisible:
    element: "売却"
    direction: UP
    centerElement: true
- tapOn: "売却"
- scrollUntilVisible:
    element: "チェインメイルを装備する"
    direction: DOWN
    centerElement: true
- tapOn: "チェインメイルを装備する"
- assertNotVisible: "チェインメイルを装備する"
- tapOn: "キャラクター画面に戻る"
- scrollUntilVisible:
    element: "防具のチェインメイルを外す"
    direction: UP
    centerElement: true
- tapOn: "防具のチェインメイルを外す"
- assertNotVisible: "防具のチェインメイルを外す"
- scrollUntilVisible:
    element: "インベントリを開く"
    direction: DOWN
    centerElement: true
- tapOn: "インベントリを開く"
- assertNotVisible: "素材の選択を解除"
- assertVisible: "種類：すべて"
- scrollUntilVisible:
    element: "チェインメイルを装備する"
    direction: DOWN
    centerElement: true
- assertVisible: "チェインメイルを装備する"
- scrollUntilVisible:
    element: "合成"
    direction: UP
    centerElement: true
- tapOn: "合成"
- scrollUntilVisible:
    element: "チェインメイルを合成素材に選択する"
    direction: DOWN
    centerElement: true
- tapOn: "チェインメイルを合成素材に選択する"
- scrollUntilVisible:
    element: "銀の指輪を合成素材に選択する"
    direction: DOWN
    centerElement: true
- tapOn: "銀の指輪を合成素材に選択する"
- scrollUntilVisible:
    element: "鉄の剣を合成素材に選択する"
    direction: DOWN
    centerElement: true
- tapOn: "鉄の剣を合成素材に選択する"
- scrollUntilVisible:
    element: "選択した3個の装備を合成する"
    direction: DOWN
    centerElement: true
- tapOn: "選択した3個の装備を合成する"
- tapOn: "キャンセル"
- tapOn: "選択した3個の装備を合成する"
- tapOn: "合成する"
- scrollUntilVisible:
    element: "インベントリ（3/3）"
    direction: UP
    centerElement: true
- assertVisible: "合成で「.*」が誕生！"
- tapOn: "売却"
- scrollUntilVisible:
    element: "木の剣を売却する"
    direction: DOWN
    centerElement: true
- tapOn: "木の剣を売却する"
- tapOn: "売却する"
- scrollUntilVisible:
    element: "インベントリ（2/2）"
    direction: UP
    centerElement: true
- assertNotVisible: "木の剣を売却する"
